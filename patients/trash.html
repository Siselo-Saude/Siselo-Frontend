<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lixeira - Usuários</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="patients-trash">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="#">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="page-title">Lixeira: Usuários</h1>

      <form id="search-form" class="toolbar search-toolbar">
        <input id="search-input" name="q" placeholder="Busca por NOME ou SES">
        <div class="actions">
          <a class="btn" href="/patients/list.html" data-back-link data-fallback="/patients/list.html">Voltar para usuários</a>
        </div>
      </form>

      <div class="table-scroll">
        <table class="data-table patients-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>SES</th>
              <th>Apagado em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="patients-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/patients.js"></script>
</body>
</html>
