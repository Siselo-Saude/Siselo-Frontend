<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuário 360 - SISELO</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="patients-show">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="#">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card patient360-card">
      <div class="page-heading patient360-header">
        <div>
          <h1 class="page-title">Usuário 360</h1>
        </div>
        <div class="actions patient360-header-actions">
          <button class="btn btn-primary" id="patient-pdf-button" type="button">Imprimir prontuário</button>
          <a class="btn" id="patient-back-link" href="/patients/list.html" data-back-link data-fallback="/patients/list.html">Voltar</a>
        </div>
      </div>

      <div id="page-alert" class="alert" hidden></div>

      <div id="patient-overview" class="patient360-overview"></div>
      <div id="patient-notes" class="patient360-note-grid"></div>

      <div id="patient-actions" class="actions patient360-actions"></div>

      <div class="tabs patient360-tabs">
        <a class="tab-link" id="patient-careplans-link" href="#">Planos de Cuidado</a>
        <a class="tab-link" id="patient-encounters-link" href="#">Atendimentos</a>
        <a class="tab-link" id="patient-transitions-link" href="#">Transições</a>
      </div>

      <section id="patient-panel-planos" class="patient360-panel">
        <h2 class="page-title patient360-panel-title">Planos de Cuidado</h2>
        <div class="table-scroll">
          <table class="data-table care-plans-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="care-plans-table-body"></tbody>
          </table>
        </div>
      </section>

      <section id="patient-panel-atendimentos" class="patient360-panel">
        <h2 class="page-title patient360-panel-title">Atendimentos</h2>
        <div class="table-scroll">
          <table class="data-table encounters-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Especialidade</th>
                <th>Resumo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="encounters-table-body"></tbody>
          </table>
        </div>
      </section>

      <section id="patient-panel-transicoes" class="patient360-panel">
        <h2 class="page-title patient360-panel-title">Transições</h2>
        <div class="table-scroll">
          <table class="data-table transitions-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>De</th>
                <th>Para</th>
                <th>Status</th>
                <th>Notas</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="transitions-table-body"></tbody>
          </table>
        </div>
      </section>

      <div class="actions patient360-footer">
        <a class="btn btn-primary" href="/index.html">Home</a>
      </div>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/patients.js"></script>
</body>
</html>
