<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacientes - SISELO</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="patients-list">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="#">CADH</a>
      <a id="nav-patients" href="/patients/list.html">Pacientes</a>
      <a id="nav-careplans" href="#">Planos</a>
      <a id="nav-encounters" href="#">Atendimentos</a>
      <a id="nav-transitions" href="#">Transicoes</a>
      <a id="nav-admin" href="/admin/users/list.html">Admin</a>
      <a id="logout-button" href="/login.html">Sair</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="page-title">Usuarios</h1>

      <form id="search-form" class="toolbar">
        <input id="search-input" name="q" placeholder="Buscar por nome/CPF/SES/telefone/email">
        <div class="actions">
          <button class="btn btn-primary" type="submit">Buscar</button>
          <a id="new-patient-link" class="btn" href="/patients/form.html">+ Novo Usuario</a>
          <a id="trash-link" class="btn" href="/patients/trash.html">Lixeira</a>
        </div>
      </form>

      <table>
        <thead>
          <tr>
            <th>Usuario</th>
            <th>CPF</th>
            <th>SES</th>
            <th>Contato</th>
            <th>Sangue</th>
            <th>Status</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody id="patients-table-body"></tbody>
      </table>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/patients.js"></script>
</body>
</html>
