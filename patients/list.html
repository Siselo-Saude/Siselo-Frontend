<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários - SISELO</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="patients-list">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="/ubs/index.html">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="page-heading">
        <h1 class="page-title">Usuários</h1>
        <a class="btn" href="/cadh/index.html" data-back-link data-fallback="/cadh/index.html">&larr; Voltar</a>
      </div>

      <form id="search-form" class="toolbar search-toolbar">
        <input id="search-input" name="q" placeholder="Busca por NOME ou CPF" aria-label="Buscar usuários" autocomplete="off">
        <div class="actions">
          <a id="new-patient-link" class="btn" href="/patients/form.html">+ Novo usuário</a>
          <a id="trash-link" class="btn" href="/patients/trash.html">Inativos</a>
        </div>
      </form>

      <div class="table-scroll">
        <table class="data-table patients-table">
          <thead>
            <tr>
              <th>Usuário</th>
              <th>CPF</th>
              <th>Equipe</th>
              <th>Contato</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="patients-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/patients.js"></script>
</body>
</html>
