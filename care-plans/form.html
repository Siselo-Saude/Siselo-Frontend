<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de Cuidado</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="care-plans-form">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="/ubs/index.html">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card transition-card">
      <a class="btn" href="/care-plans/list.html" data-back-link data-fallback="/care-plans/list.html">&larr; Voltar</a>
      <h1 id="form-title" class="page-title" style="margin-top:14px;">Novo Plano de Cuidado</h1>
      <div id="page-alert" class="alert" hidden></div>

      <form id="care-plan-form" class="transition-form-shell">
        <section class="transition-panel transition-panel-patient">
          <div class="transition-panel-header">
            <h2 class="transition-panel-title">Dados do Usuário</h2>
          </div>

          <div class="transition-panel-grid">
            <div class="field-full">
              <label for="patient-search-input">Usuário</label>
              <select id="patient_id" name="patient_id" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
              <div id="care-plan-user-search" class="transition-patient-search"></div>
            </div>
          </div>
        </section>

        <section class="transition-panel transition-panel-details">
          <div class="transition-panel-header">
            <h2 class="transition-panel-title">Dados do Plano</h2>
          </div>

          <div class="transition-panel-grid">
            <div class="field">
              <label for="start_date">Início</label>
              <input id="start_date" name="start_date" type="date" placeholder="dd/mm/aaaa">
            </div>

            <div class="field">
              <label for="end_date">Fim</label>
              <input id="end_date" name="end_date" type="date" placeholder="dd/mm/aaaa">
            </div>

            <div class="field-full">
              <label for="interventions">Condutas terapêuticas</label>
              <textarea id="interventions" name="interventions" placeholder="Descreva as condutas do plano"></textarea>
            </div>
          </div>
        </section>

        <section class="transition-panel transition-panel-details">
          <div class="transition-panel-header">
            <h2 class="transition-panel-title">Itens Assistenciais</h2>
          </div>

          <div class="actions" style="margin-top:0;">
            <button type="button" class="btn" data-add-item="alerta">+ Alerta</button>
            <button type="button" class="btn" data-add-item="meta">+ Meta</button>
            <button type="button" class="btn" data-add-item="dificuldade">+ Dificuldade</button>
            <button type="button" class="btn" data-add-item="recomendacao">+ Recomendação</button>
          </div>

          <div id="items"></div>
        </section>

        <div class="form-actions transition-form-actions">
          <a class="btn" href="/care-plans/list.html" data-back-link data-fallback="/care-plans/list.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar plano</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/care-plans.js"></script>
</body>
</html>
