<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de Cuidado</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="care-plans-form">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="#">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <a class="btn" href="/care-plans/list.html" data-back-link data-fallback="/care-plans/list.html">&larr; Voltar</a>
      <h1 id="form-title" class="page-title" style="margin-top:14px;">Novo Plano de Cuidado</h1>
      <div id="page-alert" class="alert" hidden></div>

      <form id="care-plan-form">
        <div class="form-grid">
          <div class="field-full">
            <label for="patient_id">Paciente *</label>
            <select id="patient_id" name="patient_id" required></select>
          </div>

          <div class="field">
            <label for="start_date">Inicio</label>
            <input id="start_date" name="start_date" type="date" placeholder="dd/mm/aaaa" required>
          </div>

          <div class="field">
            <label for="end_date">Fim</label>
            <input id="end_date" name="end_date" type="date" placeholder="dd/mm/aaaa">
          </div>

          <div class="field-full">
            <label for="interventions">Intervencoes medicamentosas e nao medicamentosas</label>
            <textarea id="interventions" name="interventions" placeholder="Intervencoes principais do plano"></textarea>
          </div>
        </div>

        <div class="actions" style="margin-top:18px;">
          <button type="button" class="btn" data-add-item="alerta">+ Alerta</button>
          <button type="button" class="btn" data-add-item="meta">+ Meta</button>
          <button type="button" class="btn" data-add-item="dificuldade">+ Dificuldade</button>
          <button type="button" class="btn" data-add-item="recomendacao">+ Recomendacao</button>
        </div>

        <div id="items"></div>

        <div class="form-actions">
          <a class="btn" href="/care-plans/list.html" data-back-link data-fallback="/care-plans/list.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/care-plans.js"></script>
</body>
</html>
