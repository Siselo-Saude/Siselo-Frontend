<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SISELO</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="login">
  <main class="auth-shell">
    <section class="card auth-card">
      <h1 class="hero-title">Login - SISELO</h1>
      <p class="hero-subtitle">Entre com o mesmo usuario do backend atual.</p>

      <div id="page-alert" class="alert" hidden></div>

      <form id="login-form" class="form-grid" style="grid-template-columns:1fr;">
        <div class="field-full">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="field-full">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" required>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Entrar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/auth.js"></script>
</body>
</html>
