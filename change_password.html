<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trocar Senha - SISELO</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="change-password">
  <main class="auth-shell">
    <section class="card auth-card">
      <h1 class="hero-title">Trocar senha</h1>
      <p class="hero-subtitle">Por seguranca, voce precisa definir uma nova senha para continuar.</p>

      <div id="page-alert" class="alert" hidden></div>

      <form id="change-password-form" class="form-grid" style="grid-template-columns:1fr;">
        <div class="field-full">
          <label for="password">Nova senha</label>
          <input id="password" name="password" type="password" required>
        </div>

        <div class="field-full">
          <label for="password_confirm">Confirmar nova senha</label>
          <input id="password_confirm" name="password_confirm" type="password" required>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Salvar e continuar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/auth.js"></script>
</body>
</html>
