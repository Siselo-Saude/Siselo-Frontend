<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Formulario de Usuario</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="admin-users-form">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="#">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <a class="btn" href="/admin/users/list.html" data-back-link data-fallback="/admin/users/list.html">&larr; Voltar</a>
      <h1 id="form-title" class="page-title" style="margin-top:14px;">Novo Usuario</h1>

      <div id="page-alert" class="alert" hidden></div>

      <form id="admin-user-form" class="form-grid">
        <div class="field">
          <label for="name">Nome</label>
          <input id="name" name="name" placeholder="Nome completo" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="email@instituicao.com" required>
        </div>

        <div class="field-full">
          <label style="display:flex; align-items:center; gap:8px;">
            <input id="is_active" name="is_active" type="checkbox" style="width:auto; min-height:auto;">
            Ativo
          </label>
        </div>

        <div id="temp-password-field" class="field-full">
          <label for="temp_password">Senha temporaria</label>
          <input id="temp_password" name="temp_password" placeholder="Ex: Temporaria@123">
        </div>

        <div class="field-full">
          <label>Roles</label>
          <div id="roles-container"></div>
        </div>

        <div class="form-actions field-full">
          <a class="btn" href="/admin/users/list.html" data-back-link data-fallback="/admin/users/list.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/admin-users.js"></script>
</body>
</html>
