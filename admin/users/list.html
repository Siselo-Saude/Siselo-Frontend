<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Usuarios</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="admin-users-list">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="#">CADH</a>
      <a id="nav-patients" href="/patients/list.html">Pacientes</a>
      <a id="nav-careplans" href="#">Planos</a>
      <a id="nav-encounters" href="#">Atendimentos</a>
      <a id="nav-transitions" href="#">Transicoes</a>
      <a id="nav-admin" href="/admin/users/list.html">Admin</a>
      <a id="logout-button" href="/login.html">Sair</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="page-title">Admin: Usuarios</h1>

      <form id="search-form" class="toolbar search-toolbar">
        <input id="search-input" name="q" placeholder="Buscar nome/email">
        <div class="actions">
          <button class="btn btn-primary" type="submit">Buscar</button>
          <a class="btn" href="/admin/users/form.html">+ Novo usuario</a>
        </div>
      </form>

      <div class="table-scroll">
        <table class="data-table admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Roles</th>
              <th>Status</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/admin-users.js"></script>
</body>
</html>
