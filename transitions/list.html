<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transicoes</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="transitions-list">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="#">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="page-heading">
        <h1 class="page-title">Transicoes do Cuidado</h1>
        <a class="btn" href="/cadh/index.html" data-back-link data-fallback="/cadh/index.html">&larr; Voltar</a>
      </div>
      <form id="search-form" class="toolbar search-toolbar">
        <input id="search-input" name="q" placeholder="Buscar por nome, CPF, SES, status ou servico">
        <div class="actions">
          <button class="btn btn-primary" type="submit">Buscar</button>
          <a id="new-transition-link" class="btn" href="/transitions/form.html">+ Nova transicao</a>
          <a id="trash-link" class="btn" href="/transitions/trash.html">Lixeira</a>
        </div>
      </form>

      <div class="table-scroll">
        <table class="data-table transitions-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Paciente</th>
              <th>SES</th>
              <th>CPF</th>
              <th>Origem &rarr; Destino</th>
              <th>Status</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="transitions-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/transitions.js"></script>
</body>
</html>
