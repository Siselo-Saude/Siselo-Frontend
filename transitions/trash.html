<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lixeira - Transicoes</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="transitions-trash">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="#">CADH</a>
      <a id="nav-patients" href="/patients/list.html">Pacientes</a>
      <a id="nav-careplans" href="/care-plans/list.html">Planos</a>
      <a id="nav-encounters" href="/encounters/list.html">Atendimentos</a>
      <a id="nav-transitions" href="/transitions/list.html">Transicoes</a>
      <a id="nav-admin" href="/admin/users/list.html">Admin</a>
      <a id="logout-button" href="/login.html">Sair</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="page-title">Lixeira: Transicoes</h1>
      <form id="search-form" class="toolbar search-toolbar">
        <input id="search-input" name="q" placeholder="Buscar por nome, CPF, SES, status ou servico">
        <div class="actions">
          <button class="btn btn-primary" type="submit">Buscar</button>
          <a class="btn" href="/transitions/list.html" data-back-link data-fallback="/transitions/list.html">Voltar</a>
        </div>
      </form>

      <div class="table-scroll">
        <table class="data-table transitions-table">
          <thead>
            <tr>
              <th>Apagado em</th>
              <th>Data</th>
              <th>Paciente</th>
              <th>SES</th>
              <th>CPF</th>
              <th>Origem &rarr; Destino</th>
              <th>Status</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="transitions-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/transitions.js"></script>
</body>
</html>
