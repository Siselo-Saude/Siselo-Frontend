<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendimento</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="encounters-form">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="/ubs/index.html">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card transition-card">
      <a class="btn" href="/encounters/list.html" data-back-link data-fallback="/encounters/list.html">&larr; Voltar</a>
      <h1 id="form-title" class="page-title" style="margin-top:14px;">Novo Atendimento</h1>
      <div id="page-alert" class="alert" hidden></div>

      <form id="encounter-form" class="transition-form-shell">
        <section class="transition-panel transition-panel-patient">
          <div class="transition-panel-header">
            <h2 class="transition-panel-title">Dados do Usuário</h2>
          </div>

          <div class="transition-panel-grid">
            <div class="field-full">
              <label for="patient-search-input">Usuário</label>
              <select id="patient_id" name="patient_id" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
              <div id="encounter-user-search" class="transition-patient-search"></div>
            </div>

            <div class="field encounter-team-field">
              <label>Equipe do usuário</label>
              <div id="encounter-team-display" class="team-field-display is-empty" aria-live="polite">Selecione um usuário para ver a equipe</div>
            </div>
          </div>
        </section>

        <section class="transition-panel transition-panel-details">
          <div class="transition-panel-header">
            <h2 class="transition-panel-title">Dados do Atendimento</h2>
          </div>

          <div class="transition-panel-grid">
            <div class="field">
              <label for="encounter_date">Data</label>
              <input id="encounter_date" name="encounter_date" type="date" placeholder="dd/mm/aaaa">
            </div>

            <div class="field">
              <label for="specialty">Especialidade</label>
              <input id="specialty" name="specialty" placeholder="Ex.: Nutrição">
            </div>

            <div class="field-full">
              <label for="summary">Registro clínico</label>
              <textarea id="summary" name="summary" placeholder="Descreva o atendimento"></textarea>
            </div>
          </div>
        </section>

        <div class="form-actions transition-form-actions">
          <a class="btn" href="/encounters/list.html" data-back-link data-fallback="/encounters/list.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar atendimento</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/encounters.js"></script>
</body>
</html>
