<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendimento</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="encounters-form">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="#">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <a class="btn" href="/encounters/list.html" data-back-link data-fallback="/encounters/list.html">&larr; Voltar</a>
      <h1 id="form-title" class="page-title" style="margin-top:14px;">Novo Atendimento</h1>
      <div id="page-alert" class="alert" hidden></div>

      <form id="encounter-form" class="form-grid">
        <div class="field-full">
          <label for="patient_id">Paciente *</label>
          <select id="patient_id" name="patient_id" required></select>
        </div>

        <div class="field">
          <label for="encounter_date">Data</label>
          <input id="encounter_date" name="encounter_date" type="date" placeholder="dd/mm/aaaa" required>
        </div>

        <div class="field">
          <label for="specialty">Especialidade</label>
          <input id="specialty" name="specialty" placeholder="Ex.: Nutricao" required>
        </div>

        <div class="field-full">
          <label for="summary">Resumo</label>
          <textarea id="summary" name="summary" placeholder="Resumo do atendimento"></textarea>
        </div>

        <div class="form-actions field-full">
          <a class="btn" href="/encounters/list.html" data-back-link data-fallback="/encounters/list.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/encounters.js"></script>
</body>
</html>
