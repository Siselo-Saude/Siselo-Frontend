<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SISELO</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="home">
  <header class="topbar">
    <div class="topbar-brand">Intranet CADH</div>
    <nav class="menu">
      <a id="nav-home" href="/index.html">Home</a>
      <a id="nav-cadh" href="/cadh/index.html">CADH</a>
      <a id="nav-ubs" href="#">UBS</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="page-title">SISELO - UBS-CADH</h1>
      <p class="page-subtitle">Usuario autenticado: <strong id="current-user-name"></strong></p>

      <div class="summary-grid">
        <a id="home-cadh-card" class="summary-card" href="/cadh/index.html">
          <strong>CADH</strong>
          <span class="muted">Cadastros, planos, atendimentos e transicoes.</span>
        </a>

        <a id="home-admin-card" class="summary-card" href="/admin/users/list.html">
          <strong>Admin: Usuarios</strong>
          <span class="muted">Gestao de usuarios usando a camada nova de API.</span>
        </a>
      </div>
    </section>
  </main>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await SISELO.requireSession();
      if (!user) return;

      SISELO.bindShell('home');
      const permissions = SISELO.getUiPermissions(user);
      document.getElementById('home-cadh-card').hidden = !(
        permissions.has('patients.view') ||
        permissions.has('careplans.view') ||
        permissions.has('encounters.view') ||
        permissions.has('transitions.view')
      );
      document.getElementById('home-admin-card').hidden = !permissions.has('admin.manage');
    });
  </script>
</body>
</html>
