  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await SISELO.requireSession();
      if (!user) return;

      SISELO.bindShell('home');
      const permissions = SISELO.getUiPermissions(user);
      document.getElementById('home-cadh-card').hidden = !(
        permissions.has('patients.view') ||
        permissions.has('careplans.view') ||
        permissions.has('encounters.view') ||
        permissions.has('transitions.view')
      );

      if (permissions.has('transitions.view')) {
        try {
          const data = await SISELO.apiRequest('/transitions/list.php');
          const rows = Array.isArray(data.rows) ? data.rows : [];
          const normalize = (value) => SISELO.normalizeSearchText(value || '');
          const isCadhService = (value) => {
            const normalized = normalize(value);
            return normalized.includes('cadh');
          };
          const fromUbsToCadh = rows.filter((row) => {
            return isCadhService(row.to_service) && !isCadhService(row.from_service);
          }).length;
          const inProgress = rows.filter((row) => normalize(row.status) === 'em_andamento').length;
          const fromCadhToUbs = rows.filter((row) => {
            return isCadhService(row.from_service) && !isCadhService(row.to_service);
          }).length;

          document.getElementById('home-total-users-count').textContent = String(fromUbsToCadh).padStart(2, '0');
          document.getElementById('home-active-users-count').textContent = String(inProgress).padStart(2, '0');
          document.getElementById('home-inactive-users-count').textContent = String(fromCadhToUbs).padStart(2, '0');
        } catch (error) {
        }
      }
    });
  </script>
