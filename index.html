          <div>
            <strong>Em andamento no</strong>
            <span>CADH</span>
          </div>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await SISELO.requireSession();
      if (!user) return;

      SISELO.bindShell('home');
      const permissions = SISELO.getUiPermissions(user);
      document.getElementById('home-cadh-card').hidden = !(
        permissions.has('patients.view') ||
        permissions.has('careplans.view') ||
        permissions.has('encounters.view') ||
        permissions.has('transitions.view')
      );

      if (permissions.has('patients.view')) {
        try {
          const data = await SISELO.apiRequest('/patients/list.php');
          document.getElementById('home-cadh-progress-count').textContent = String((data.rows || []).length).padStart(2, '0');
        } catch (error) {
        }
      }

      if (permissions.has('transitions.view')) {
        try {
          const data = await SISELO.apiRequest('/transitions/list.php');
          const rows = Array.isArray(data.rows) ? data.rows : [];
          const normalize = (value) => SISELO.normalizeSearchText(value);
          const ubsToCadh = rows.filter((row) => normalize(row.from_service).includes('ubs') && normalize(row.to_service).includes('cadh')).length;
          const cadhToUbs = rows.filter((row) => normalize(row.from_service).includes('cadh') && normalize(row.to_service).includes('ubs')).length;
          document.getElementById('home-ubs-cadh-count').textContent = String(ubsToCadh).padStart(2, '0');
          document.getElementById('home-cadh-ubs-count').textContent = String(cadhToUbs).padStart(2, '0');
        } catch (error) {
        }
      }
    });
  </script>
</body>
</html>
